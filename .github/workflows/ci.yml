name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege at workflow level; publish jobs declare packages: write.
permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests con coverage (umbral 70%)
        run: |
          mkdir -p TestResults/backend
          docker run --rm -v "${{ github.workspace }}/TestResults/backend:/out" backend-test:ci

      - name: Resumen de coverage backend
        if: ${{ !cancelled() }}
        run: |
          if [ -f TestResults/backend/SummaryGithub.md ]; then
            cat TestResults/backend/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No backend coverage summary found" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publicar coverage backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            TestResults/backend/coverage.html
            TestResults/backend/coverage.txt
            TestResults/backend/coverage.out
            TestResults/backend/SummaryGithub.md

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ÚLTIMO paso propio: si los tests fallaron, nunca se llega acá.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests con coverage (umbrales vitest)
        run: |
          mkdir -p TestResults/frontend
          docker run --rm -v "${{ github.workspace }}/TestResults/frontend:/out" frontend-test:ci

      - name: Resumen de coverage frontend
        if: ${{ !cancelled() }}
        run: |
          if [ -f TestResults/frontend/SummaryGithub.md ]; then
            cat TestResults/frontend/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No frontend coverage summary found" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publicar coverage frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: |
            TestResults/frontend/coverage
            TestResults/frontend/coverage-summary.json
            TestResults/frontend/SummaryGithub.md

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # Solo cuando YA están las URLs de Render (variables de repo). Sin eso el publish
    # a GHCR sigue siendo la entrega parcial; el deploy no ensucia main en rojo.
    if: github.ref == 'refs/heads/main' && vars.QA_API_URL != '' && vars.QA_FRONT_URL != ''
    environment: qa
    steps:
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_FRONT" ]; then
            echo "Faltan secrets RENDER_HOOK_API_QA / RENDER_HOOK_FRONT_QA en el environment qa."
            exit 1
          fi
          # imgURL: el entorno EJECUTA la imagen publicada (build once, deploy many).
          # --get --data-urlencode agrega &imgURL=… y codifica ':' y '/'.
          # La URL del hook va ÚLTIMA (único argumento suelto).
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          echo "Deploy QA api:   $IMG_API"
          echo "Deploy QA front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: ${{ vars.QA_API_URL }}
          URL_FRONT: ${{ vars.QA_FRONT_URL }}
        run: |
          if [ -z "$URL_API" ] || [ -z "$URL_FRONT" ]; then
            echo "Faltan variables de repositorio QA_API_URL y QA_FRONT_URL"
            exit 1
          fi
          echo "Esperando a que QA esté vivo (API=$URL_API FRONT=$URL_FRONT)..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/health" \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              BODY=$(curl -fsS --max-time 10 "$URL_API/api/health")
              echo "$BODY"
              echo "$BODY" | grep -q '"database":"connected"' || {
                echo "❌ /api/health no confirma database connected"; exit 1
              }
              echo "✅ QA responde (API + BD + front)"; exit 0
            fi
            echo "intento $i/30 — aún no; sleep 20"
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (sin browser)
        run: npm ci
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: ${{ vars.QA_API_URL }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra QA
        env:
          E2E_BASE_URL: ${{ vars.QA_FRONT_URL }}
        run: npx playwright test e2e/actividades.spec.js
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    if: vars.PROD_API_URL != '' && vars.PROD_FRONT_URL != ''
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy de la MISMA imagen a PROD
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_FRONT" ]; then
            echo "Faltan secrets RENDER_HOOK_*_PROD en el environment production."
            exit 1
          fi
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          echo "Deploy PROD api:   $IMG_API"
          echo "Deploy PROD front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: ${{ vars.PROD_API_URL }}
          URL_FRONT: ${{ vars.PROD_FRONT_URL }}
        run: |
          if [ -z "$URL_API" ] || [ -z "$URL_FRONT" ]; then
            echo "Faltan variables PROD_API_URL y PROD_FRONT_URL"
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/health" \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              BODY=$(curl -fsS --max-time 10 "$URL_API/api/health")
              echo "$BODY"
              echo "$BODY" | grep -q '"database":"connected"' || {
                echo "❌ /api/health no confirma database connected"; exit 1
              }
              echo "✅ PROD responde (API + BD + front)"; exit 0
            fi
            echo "intento $i/30 — aún no; sleep 20"
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
