# Fallback local QA environment (TP6 §3.6 / TP7 §3.6). Isolated Compose project.
# Ejecuta las imágenes del registry (no build local): IMAGE_TAG=sha-<commit>
name: qa

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - db_data_qa:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/mateopappa/ingsoft3-tp01-backend:${IMAGE_TAG:?falta IMAGE_TAG}
    platform: linux/amd64
    environment:
      DATABASE_URL: "postgres://postgres:${DB_PASSWORD}@db:5432/app?sslmode=disable"
      APP_PORT: "8080"
      APP_ENV: "qa"
      SESSION_SECRET: "${SESSION_SECRET:-flow_qa_session_secret_change_me_1234567890}"
      COOKIE_SECURE: "false"
      AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/mateopappa/ingsoft3-tp01-frontend:${IMAGE_TAG:?falta IMAGE_TAG}
    platform: linux/amd64
    environment:
      BACKEND_URL: http://backend:8080
      DNS_RESOLVER: 127.0.0.11
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data_qa:
